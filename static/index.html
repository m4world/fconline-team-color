<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Online 랭커 기용 분석</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f1f5f9; }
        .card { background-color: #1e293b; border-radius: 0.75rem; padding: 1.5rem; }
        .table-header { background-color: #334155; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-blue-400">랭커 최다 기용 선수 분석</h1>
            <button onclick="triggerFetch()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg font-medium transition">데이터 수집</button>
        </header>

        <div id="position-container" class="space-y-12">
            <div class="text-center py-20 text-gray-400">데이터를 불러오는 중입니다...</div>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                const res = await fetch('/api/overview');
                const data = await res.json();
                const container = document.getElementById('position-container');
                container.innerHTML = '';

                if (Object.keys(data.positions).length === 0) {
                    container.innerHTML = '<div class="text-center py-20">수집된 데이터가 없습니다. 수집 버튼을 눌러주세요.</div>';
                    return;
                }

                // 포지션별 섹션 생성
                for (const [pos, players] of Object.entries(data.positions)) {
                    const section = document.createElement('section');
                    section.className = 'card shadow-xl';
                    
                    section.innerHTML = `
                        <h2 class="text-xl font-bold mb-4 text-blue-300 border-b border-gray-700 pb-2">${pos}</h2>
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm text-left">
                                <thead class="table-header text-gray-200">
                                    <tr>
                                        <th class="p-3">순위</th>
                                        <th class="p-3">선수명</th>
                                        <th class="p-3">유형</th>
                                        <th class="p-3 text-right">총 경기수</th>
                                        <th class="p-3 text-right">평균 득점</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${players.slice(0, 20).map((p, i) => `
                                        <tr class="border-b border-gray-700 hover:bg-gray-700/50 transition">
                                            <td class="p-3 font-bold text-gray-400">${i + 1}</td>
                                            <td class="p-3 font-semibold">${p.spname}</td>
                                            <td class="p-3 text-gray-400 text-xs">${p.matchtype_name}</td>
                                            <td class="p-3 text-right text-blue-400 font-mono">${p.matchCount.toLocaleString()}</td>
                                            <td class="p-3 text-right text-green-400">${(p.avg_goal || 0).toFixed(2)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                    container.appendChild(section);
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function triggerFetch() {
            alert('데이터 수집을 시작합니다. 잠시 후 새로고침 해주세요.');
            await fetch('/api/fetch', { method: 'POST' });
        }

        loadData();
        // 30초마다 데이터 갱신 확인
        setInterval(loadData, 30000);
    </script>
</body>
</html>
